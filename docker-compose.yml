services:
  payload:
    image: node:24-alpine
    ports:
      - '3001:3001'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run dev --hostname 0.0.0.0 --port 3001"
    env_file:
      - .env
    # Uses the Neon PostgreSQL connection configured in .env.
volumes:
  node_modules:
