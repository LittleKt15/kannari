minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Exact releases reviewed in docs/dependency-trust-review.md.
# Re-review exceptions when upgrading their parent dependencies.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - pino@9.14.0
  - semver@6.3.1
  - undici-types@6.21.0
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
